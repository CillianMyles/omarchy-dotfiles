# Headless server: never suspend on lid close, even on battery. A power cut
# takes away both mains power and the KVM's display, and a laptop with its lid
# closed would then sleep until someone opened it. Suspend from the menu before
# carrying a laptop. UPower still hibernates it at critical battery.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
